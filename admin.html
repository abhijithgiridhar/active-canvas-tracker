<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org Dashboard — Money Tracker</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap-wide" id="app"></div>

<script type="module">
import { fetchGirls, fetchEntries, CATEGORIES, money, monthKey, monthLabel, summarizeByMonth, totalsFor, exportOrgExcel } from './shared.js';

// Change this to something only the org team knows before sharing the link.
const ADMIN_PASSWORD = 'CHANGE_ME_2026';

let STATE = { authed: false, girls: [], entries: [], month: monthKey(new Date()) };

function render() {
  document.getElementById('app').innerHTML = STATE.authed ? viewDashboard() : viewLogin();
  wire();
}

function viewLogin() {
  return `
    <div class="center-card">
      <h1 style="font-size:20px; font-weight:700; margin-bottom:4px;">Org Dashboard</h1>
      <p class="muted small" style="margin-bottom:24px;">Active Canvas — Money Tracker</p>
      <div class="section">
        <div class="field">
          <label>Password</label>
          <input type="password" id="pw">
        </div>
        <p class="small" style="color:#B00000; margin-bottom:12px;" id="pwError"></p>
        <button class="btn btn-solid btn-block" id="pwBtn">View dashboard</button>
      </div>
    </div>
  `;
}

function wire() {
  const pwBtn = document.getElementById('pwBtn');
  if (pwBtn) pwBtn.onclick = async () => {
    const val = document.getElementById('pw').value;
    if (val !== ADMIN_PASSWORD) { document.getElementById('pwError').textContent = 'Incorrect password.'; return; }
    sessionStorage.setItem('mt_admin', '1');
    STATE.authed = true;
    try {
      await loadData();
    } catch (err) {
      document.getElementById('app').innerHTML = `
        <div class="center-card">
          <h1 style="font-size:18px; font-weight:700; margin-bottom:10px;">Can't connect</h1>
          <p class="small muted">This usually means <code>firebase-config.js</code> still has placeholder values, or the Firestore rules haven't been published yet. See README.md.</p>
          <p class="small" style="margin-top:12px; color:#B00000;">${err.message || err}</p>
        </div>`;
      return;
    }
    render();
  };
  const logoutBtn = document.getElementById('logoutBtn');
  if (logoutBtn) logoutBtn.onclick = () => { sessionStorage.removeItem('mt_admin'); STATE.authed = false; render(); };
  const monthSel = document.getElementById('monthSel');
  if (monthSel) monthSel.onchange = () => { STATE.month = monthSel.value; render(); };
  const exportBtn = document.getElementById('exportBtn');
  if (exportBtn) exportBtn.onclick = () => exportOrgExcel(STATE.girls, STATE.entries);
}

async function loadData() {
  STATE.girls = await fetchGirls();
  STATE.entries = await fetchEntries(null);
}

function viewDashboard() {
  const months = [...new Set(STATE.entries.map(e => monthKey(e.date)))].sort();
  if (!months.includes(STATE.month) && months.length) STATE.month = months[months.length - 1];
  const mk = STATE.month || monthKey(new Date());

  const perGirl = STATE.girls.map(g => {
    const mine = STATE.entries.filter(e => e.girlId === g.id);
    const byMonth = summarizeByMonth(mine);
    const t = totalsFor(byMonth[mk] || { income: 0, fixed: 0, variable: 0, savings: 0 });
    const monthEntryCount = (byMonth[mk] || { count: 0 }).count;
    const lastDate = mine.reduce((mx, e) => { const d = new Date(e.date).getTime(); return d > mx ? d : mx; }, 0);
    const daysSince = lastDate ? Math.floor((Date.now() - lastDate) / 86400000) : null;
    return { name: g.name, cohort: g.cohort || '—', t, monthEntryCount, daysSince };
  });

  let totIncome = 0, totExpense = 0, totSavings = 0, active = 0;
  const flagged = [];
  perGirl.forEach(g => {
    totIncome += g.t.A; totExpense += g.t.E; totSavings += g.t.D;
    if (g.monthEntryCount > 0) active++;
    if (g.daysSince === null || g.daysSince > 5) flagged.push(g);
  });

  const catTotals = {};
  CATEGORIES.forEach(c => (catTotals[c.num] = 0));
  STATE.entries.forEach(e => { if (catTotals[e.categoryNum] !== undefined) catTotals[e.categoryNum] += Number(e.amount) || 0; });
  const catRows = CATEGORIES.map(c => ({ ...c, total: catTotals[c.num] })).filter(c => c.total > 0).sort((a, b) => b.total - a.total);
  const maxCat = Math.max(1, ...catRows.map(c => c.total));

  return `
    <header class="masthead">
      <div>
        <h1>Org Dashboard</h1>
        <p class="tag">Active Canvas — Money Tracker</p>
      </div>
      <div class="row gap8">
        <select id="monthSel">
          ${months.map(m => `<option value="${m}" ${m === mk ? 'selected' : ''}>${monthLabel(m)}</option>`).join('') || `<option>${monthLabel(mk)}</option>`}
        </select>
        <button class="btn btn-sm" id="exportBtn">Download full Excel</button>
        <button class="btn btn-sm" id="logoutBtn">Log out</button>
      </div>
    </header>

    <div class="stat-grid">
      <div class="stat"><div class="lbl">Girls tracking</div><div class="val mono">${active} / ${perGirl.length}</div></div>
      <div class="stat"><div class="lbl">Total income</div><div class="val mono">${money(totIncome)}</div></div>
      <div class="stat"><div class="lbl">Total expenses</div><div class="val mono">${money(totExpense)}</div></div>
      <div class="stat"><div class="lbl">Total saved</div><div class="val mono">${money(totSavings)}</div></div>
    </div>

    <div class="row gap16 wrap-flex" style="align-items:flex-start;">
      <div class="section" style="flex:2; min-width:360px;">
        <h2>Spend &amp; income by category — all time</h2>
        ${catRows.length ? catRows.map(c => `
          <div style="margin-bottom:10px;">
            <div class="row between small mono" style="margin-bottom:4px;"><span class="mono" style="font-family:inherit; font-weight:600;">${c.num}. ${c.label}</span><span>${money(c.total)}</span></div>
            <div style="background:var(--fill); height:8px;"><div style="height:100%; background:var(--ink); width:${(c.total / maxCat * 100).toFixed(1)}%;"></div></div>
          </div>
        `).join('') : `<div class="empty">No entries logged yet.</div>`}
      </div>
      <div class="section" style="flex:1; min-width:260px;">
        <h2>Needs attention</h2>
        ${flagged.length ? flagged.map(g => `
          <div class="row between" style="padding:8px 0; border-bottom:1px solid var(--line);">
            <span class="small">${g.name}</span>
            <span class="tag-chip solid">${g.daysSince === null ? 'No entries' : g.daysSince + 'd inactive'}</span>
          </div>
        `).join('') : `<p class="muted small">Everyone is logging regularly.</p>`}
      </div>
    </div>

    <div class="section">
      <h2>Per-girl summary — ${monthLabel(mk)}</h2>
      <div class="table-scroll">
      <table>
        <thead><tr><th>Name</th><th>Cohort</th><th class="num">Income (A)</th><th class="num">Fixed (B)</th><th class="num">Variable (C)</th><th class="num">Saved (D)</th><th class="num">Balance (G)</th><th class="num">Entries</th><th>Last active</th></tr></thead>
        <tbody>
          ${perGirl.map(g => `
            <tr>
              <td style="font-weight:600;">${g.name}</td>
              <td class="muted">${g.cohort}</td>
              <td class="num mono">${money(g.t.A)}</td>
              <td class="num mono">${money(g.t.B)}</td>
              <td class="num mono">${money(g.t.C)}</td>
              <td class="num mono">${money(g.t.D)}</td>
              <td class="num mono" style="font-weight:700;">${money(g.t.G)}</td>
              <td class="num mono">${g.monthEntryCount}</td>
              <td class="muted">${g.daysSince === null ? '—' : g.daysSince === 0 ? 'Today' : g.daysSince + 'd ago'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    </div>
  `;
}

(async function boot() {
  if (sessionStorage.getItem('mt_admin') === '1') {
    STATE.authed = true;
    try { await loadData(); } catch (err) { STATE.authed = false; sessionStorage.removeItem('mt_admin'); }
  }
  render();
})();
</script>
</body>
</html>
